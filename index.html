<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Haven</title>
<style>
  :root { --bg:#f2f4f0; --surface:#fff; --ink:#1d211d; --muted:#5f675f; --line:#d8ddd5; --accent:#1f6f5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131714; --surface:#1b201c; --ink:#e8ece6; --muted:#98a298; --line:#2f372f; --accent:#5fc2a5; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    padding: 32px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card { display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; color:inherit; text-decoration:none; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card strong { display:block; font-size:18px; }
  a.card span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>The Haven</h1>
  <p class="lead">Live pages for the shelter team.</p>
  <ul>
    <li><a class="card" href="new-haven-plan/"><strong>New Haven room plan</strong><span>Which dogs are in which room, drawn on the site plan. Updates from the planning sheet.</span></a></li>
    <li><a class="card" href="build-your-own-plan/"><strong>Build your own plan</strong><span>Pick which dogs come to the New Haven, drag them into rooms, and publish your idea for others to see.</span></a></li>
  </ul>
</main>
</body>
</html>
